<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#05070d;color:#fff;padding:16px}
.box{max-width:400px;margin:0 auto;background:#0d1117;border:2px solid #a855f7;border-radius:16px;padding:18px}
h2{color:#a855f7;text-align:center;margin-bottom:14px;font-size:18px}
.tabs{display:flex;gap:3px;margin-bottom:12px;background:#05070d;padding:3px;border-radius:10px}
.tab{flex:1;padding:8px;background:transparent;border:none;color:#8b949e;font-size:12px;font-weight:bold;border-radius:7px;cursor:pointer;font-family:inherit}
.tab.on{background:linear-gradient(135deg,#a855f7,#ff0080);color:#fff}
.tc{display:none}.tc.on{display:block}
input,select{width:100%;padding:14px;font-size:16px;background:#05070d;color:#fff;border:1.5px solid #a855f7;border-radius:8px;text-align:center;margin-bottom:10px;outline:none;font-family:inherit}
button{width:100%;padding:14px;font-size:15px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-bottom:8px;color:#fff;font-family:inherit}
.g{background:linear-gradient(135deg,#a855f7,#ff0080)}.g:disabled{background:#21262d;color:#8b949e}
.b{background:#1f6feb}.gr{background:#30363d}.z{background:#0068ff}
.gold{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000}
textarea{width:100%;height:180px;padding:10px;background:#05070d;color:#7ee787;border:1.5px solid #a855f7;border-radius:8px;font-family:monospace;font-size:12px;display:none;resize:none}
textarea.on{display:block}
#msg,#msg2{margin-top:10px;padding:10px;text-align:center;font-size:13px;border-radius:8px;min-height:20px;font-weight:600}
.ok{background:#238636}.er{background:#da3633}
.hide{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.sb{background:#05070d;border-radius:8px;padding:12px 6px;text-align:center;border:1px solid #a855f7}
.sn{font-size:20px;font-weight:bold;color:#a855f7;font-family:monospace}
.sl{font-size:10px;color:#8b949e;margin-top:4px}
.chat{height:220px;background:#05070d;border:1.5px solid #a855f7;border-radius:10px;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.cm{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5}
.ca{background:#21262d;color:#e6edf3;align-self:flex-start}
.cu{background:#a855f7;color:#fff;align-self:flex-end}
.ca b{color:#a855f7}
.cir{display:flex;gap:6px;margin-top:10px}
.cir input{flex:1;margin:0;padding:12px;font-size:14px;text-align:left}
.cs{width:50px;background:#a855f7;border:none;color:#fff;border-radius:8px;font-size:18px;cursor:pointer;margin:0}
.qb{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.q{padding:6px 10px;background:#21262d;border:1px solid #a855f7;color:#c9a7f0;border-radius:20px;font-size:11px;cursor:pointer;font-weight:600;margin:0;width:auto}
.ft{text-align:center;font-size:11px;color:#484f58;margin-top:14px;padding-top:12px;border-top:1px solid #a855f7}
.ft b{color:#a855f7}
.badge{position:fixed;top:15px;right:15px;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:900;box-shadow:0 0 20px rgba(255,215,0,.8);z-index:9999;display:none}
.badge.on{display:block}
.abox{background:linear-gradient(135deg,rgba(212,160,23,.15),rgba(247,201,72,.1));border:1.5px solid rgba(212,160,23,.5);border-radius:10px;padding:12px;margin-bottom:10px}
.atitle{color:#f7c948;font-weight:bold;font-size:13px;margin-bottom:10px;text-align:center}
.ain{width:100%;padding:10px;background:#05070d;color:#fff;border:1.5px solid rgba(212,160,23,.4);border-radius:8px;font-size:14px;text-align:center;margin-bottom:8px;outline:none}
.abtn{padding:10px;font-size:13px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;color:#000;background:linear-gradient(135deg,#d4a017,#f7c948);margin-bottom:6px;font-family:inherit;width:100%}
.abtn.red{background:linear-gradient(135deg,#da3633,#f85149);color:#fff}
.abtn.gray{background:#30363d;color:#fff}
.alist{background:#05070d;border:1px solid rgba(212,160,23,.3);border-radius:8px;padding:8px;margin-top:8px;font-size:11px;font-family:monospace;max-height:200px;overflow-y:auto;color:#e6edf3}
</style>

<script>
var ZP='0947490509';
var H='com.dts.freefiremax\ncom.dts.freefireth\ngamesecurity.us.freefiremobile.com\ngarena.co.id\ngin.freefireind.in\ngin.freefiremobile.com\nhotro.ff.garena.vn\nna-gin.freefiremobile.com';
var K=['GP_VIP','GP','GP-ADMIN','GP-1day','GP-10m','GP-15s','GP-30DAY'];
var L={'GP_VIP':24,'GP':0,'GP-ADMIN':0,'GP-1day':24,'GP-10m':10/60,'GP-15s':15/3600,'GP-30DAY':720};
var hid=false,t1=null,t2=null;

function $(i){return document.getElementById(i)}
function m1(t,c){var m=$('msg');m.textContent=t;m.className=c||''}
function m2(t,c){var m=$('msg2');m.textContent=t;m.className=c||''}
function gs(k,d){try{var v=localStorage.getItem('ff_'+k);return v?parseInt(v,10):(d||0)}catch(e){return d||0}}
function ss(k,v){try{localStorage.setItem('ff_'+k,String(v))}catch(e){}}
function gsv(k,d){try{var v=localStorage.getItem('ff_'+k);return v!==null?v:(d||'')}catch(e){return d||''}}
function ssv(k,v){try{localStorage.setItem('ff_'+k,String(v))}catch(e){}}
function is(k){var v=gs(k,0)+1;ss(k,v);return v}
function td(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function cnd(){if(gs('ld','')!==td()){ss('ld',td());ss('today',0)}}
function rs(){$('sv').textContent=gs('visits',0);$('su').textContent=gs('unlocks',0);$('st').textContent=gs('today',0)}
function cst(){try{localStorage.removeItem('ff_visits');localStorage.removeItem('ff_unlocks');localStorage.removeItem('ff_today');localStorage.removeItem('ff_ld');rs()}catch(e){}}

cnd();is('visits');is('today');

function tab(n){
var ts=document.querySelectorAll('.tab'),cs=document.querySelectorAll('.tc');
for(var i=0;i<ts.length;i++){ts[i].classList.remove('on');cs[i].classList.remove('on')}
ts[n].classList.add('on');cs[n].classList.add('on');
if(n===2)rs();
if(n===1)setTimeout(function(){var b=$('cb');if(b)b.scrollTop=b.scrollHeight},100);
}

function zalo(){var u='https://zalo.me/'+ZP;try{window.open(u,'_blank')}catch(e){window.location.href=u}}

function getUserKeys(){
var uk=JSON.parse(gsv('userKeys','{}'));
var list=K.slice();
for(var k in uk){if(list.indexOf(k)===-1&&uk[k]!==undefined)list.push(k)}
return list;
}
function getLimit(k){
var uk=JSON.parse(gsv('userKeys','{}'));
if(uk[k]!==undefined)return uk[k];
return L[k];
}
function getKeyType(k){
if(k==='GP-ADMIN')return 'admin';
var kt=JSON.parse(gsv('keyTypes','{}'));
return kt[k]||'user';
}
function isUsed(k){
var u=JSON.parse(gsv('usedKeys','[]'));
return u.indexOf(k)!==-1;
}
function markUsed(k){
var u=JSON.parse(gsv('usedKeys','[]'));
if(u.indexOf(k)===-1){u.push(k);ssv('usedKeys',JSON.stringify(u))}
}
function rmUK(k){
var uk=JSON.parse(gsv('userKeys','{}'));
delete uk[k];
ssv('userKeys',JSON.stringify(uk));
}

function showAdminTab(){
$('title').innerHTML='📡 HOSTS FF <span style="color:#ffd700">👑</span>';
if(!$('tb2')){
var tb=document.createElement('button');
tb.className='tab';
tb.id='tb2';
tb.textContent='👑';
tb.onclick=function(){tab(3)};
$('tabs').appendChild(tb);
}
var b=$('badge');if(b)b.classList.add('on');
}

function open(){
if(t1){clearInterval(t1);t1=null}
var k=$('ki').value.trim().toUpperCase();
if(!k){m1('⚠️ Chưa nhập key','er');return}

var ak=getUserKeys();
if(ak.indexOf(k)===-1){m1('❌ Key không hợp lệ','er');return}

var ktype=getKeyType(k);

if(ktype==='admin'){
m1('👑 Đang mở admin...','ok');
showAdminTab();
setTimeout(function(){unlock(k,ktype)},200);
return;
}

if(isUsed(k)){m1('🚫 Key đã dùng!','er');return}
m1('⏳ Đang mở khoá...','');
$('bo').disabled=true;
var c=5;
$('bo').textContent='⏳ '+c+'s...';
t1=setInterval(function(){
c--;
if(c>0){$('bo').textContent='⏳ '+c+'s...'}
else{clearInterval(t1);t1=null;unlock(k,ktype)}
},1000);
}

function unlock(k,ktype){
$('s1').classList.add('hide');
$('s2').classList.remove('hide');
var a=$('ha');a.value=H;a.classList.add('on');
is('unlocks');

if(ktype==='admin'){
m2('👑 ADMIN KEY — Vĩnh viễn','ok');
return;
}

if(t2){clearInterval(t2);t2=null}
markUsed(k);
ssv('activeKey',k);
var lh=getLimit(k);
if(lh===undefined)lh=24;
if(lh===0){m2('✅ Vĩnh viễn','ok');return}
var se=gs('end_'+k,0);
var end;
if(se>Date.now())end=se;
else{end=Date.now()+lh*3600000;ss('end_'+k,end)}
function tk(){
var left=end-Date.now();
if(left<=0){
clearInterval(t2);t2=null;
rmUK(k);
try{localStorage.removeItem('ff_end_'+k)}catch(e){}
try{localStorage.removeItem('ff_activeKey')}catch(e){}
reset();
m1('⏰ Hết hạn!','er');
return;
}
var h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000),s=Math.floor((left%60000)/1000);
var d=Math.floor(h/24),hh=h%24;
var tt;
if(d>0)tt=d+'d '+hh+'h '+m+'m';
else if(h>0)tt=h+'h '+m+'m '+s+'s';
else if(m>0)tt=m+'m '+s+'s';
else tt=s+'s';
m2('🎉 Còn '+tt,'ok');
}
tk();t2=setInterval(tk,1000);
}

function cp(){
var a=$('ha'),t=a.value;
if(!t){m2('⚠️ Chưa có hosts','er');return}
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(t).then(function(){m2('✅ Đã copy!','ok')}).catch(function(){fb(a)});
}else{fb(a)}
}
function fb(a){
try{a.focus();a.select();a.setSelectionRange(0,a.value.length);
if(document.execCommand('copy'))m2('✅ Đã copy!','ok');
else m2('👉 Nhấn giữ → Copy','er');
}catch(e){m2('👉 Nhấn giữ → Copy','er')}
}

function dl(){
var t=$('ha').value;
if(!t)return;
try{
var b=new Blob([t],{type:'text/plain'});
var u=URL.createObjectURL(b);
var a=document.createElement('a');
a.href=u;a.download='hosts.txt';
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(u)},1000);
m2('✅ Đã tải!','ok');
}catch(e){m2('❌ Lỗi','er')}
}

function hide(){
var a=$('ha');
hid=!hid;
a.style.filter=hid?'blur(7px)':'none';
}

function reset(){
if(t1){clearInterval(t1);t1=null}
if(t2){clearInterval(t2);t2=null}
try{localStorage.removeItem('ff_activeKey')}catch(e){}
var b=$('badge');if(b)b.classList.remove('on');
var tb=$('tb2');
if(tb){
tab(0);
tb.remove();
}
$('title').innerHTML='📡 HOSTS FREE FIRE';
$('ki').value='';
$('s1').classList.remove('hide');
$('s2').classList.add('hide');
$('ha').classList.remove('on');
$('ha').value='';
$('ha').style.filter='none';
hid=false;
$('bo').textContent='🔓 MỞ KHOÁ';
$('bo').disabled=false;
m1('','');m2('','');
}

function adminAdd(){
var nk=$('nk').value.trim().toUpperCase();
var nl=$('nl').value;
var nt=$('nt').value;
if(!nk){alert('Chưa nhập key');return}
var lim;
if(nl.indexOf('/')>-1){var p=nl.split('/');lim=parseFloat(p[0])/parseFloat(p[1])}
else{lim=parseFloat(nl)}
if(K.indexOf(nk)===-1)K.push(nk);
L[nk]=lim;
var uk=JSON.parse(gsv('userKeys','{}'));
uk[nk]=lim;
ssv('userKeys',JSON.stringify(uk));
var kt=JSON.parse(gsv('keyTypes','{}'));
kt[nk]=nt;
ssv('keyTypes',JSON.stringify(kt));
alert('✅ Đã thêm: '+nk);
$('nk').value='';
}

function adminDel(){
var tk=$('tk').value.trim().toUpperCase();
if(!tk){alert('Chưa nhập key');return}
if(tk==='GP-ADMIN'){alert('Không xoá ADMIN');return}
var uk=JSON.parse(gsv('userKeys','{}'));
delete uk[tk];
ssv('userKeys',JSON.stringify(uk));
var kt=JSON.parse(gsv('keyTypes','{}'));
delete kt[tk];
ssv('keyTypes',JSON.stringify(kt));
alert('🗑️ Đã xoá: '+tk);
$('tk').value='';
}

function adminGift(){
var gc=$('gc').value.trim().toUpperCase();
var gk=$('gk').value.trim().toUpperCase();
if(!gc){alert('Chưa nhập code');return}
if(!gk){alert('Chưa nhập key');return}
var cg=JSON.parse(gsv('customGifts','{}'));
cg[gc]={key:gk,limit:24};
ssv('customGifts',JSON.stringify(cg));
if(K.indexOf(gk)===-1)K.push(gk);
L[gk]=24;
var uk=JSON.parse(gsv('userKeys','{}'));
uk[gk]=24;
ssv('userKeys',JSON.stringify(uk));
alert('🎁 Đã tạo code!\nCode: '+gc+'\nKey: '+gk);
$('gc').value='';$('gk').value='';
}

function adminList(){
var box=$('alist');
var cg=JSON.parse(gsv('customGifts','{}'));
var ktAll=JSON.parse(gsv('keyTypes','{}'));
var html='<b>Key đã cấp:</b><br>';
var uk=JSON.parse(gsv('userKeys','{}'));
var has=false;
for(var kk in uk){
if(kk==='GP-ADMIN')continue;
var tag=(ktAll[kk]==='admin')?'👑':'🔑';
html+='• '+tag+' <b style="color:#f7c948">'+kk+'</b><br>';
has=true;
}
if(!has)html+='(chưa cấp)';
html+='<br><b>Code:</b><br>';
has=false;
for(var c in cg){
html+='• <b style="color:#7ee787">'+c+'</b> → '+cg[c].key+'<br>';
has=true;
}
if(!has)html+='(chưa tạo)';
box.innerHTML=html;
}

function adminWipe(){
if(!confirm('⚠️ XOÁ TẤT CẢ?'))return;
if(!confirm('Chắc chắn?'))return;
try{
localStorage.removeItem('ff_userKeys');
localStorage.removeItem('ff_usedKeys');
localStorage.removeItem('ff_usedGifts');
localStorage.removeItem('ff_customGifts');
localStorage.removeItem('ff_keyTypes');
alert('🗑️ Đã xoá!');
}catch(e){}
}

function am(t,ty){
var b=$('cb'),d=document.createElement('div');
d.className='cm '+(ty==='u'?'cu':'ca');
d.innerHTML=t;
b.appendChild(d);
b.scrollTop=b.scrollHeight;
}
function ai(q){
var t=q.toLowerCase();
if(t.indexOf('hello')>-1||t.indexOf('helo')>-1)return '👋 Hello!';
if(t.indexOf('chào')>-1||t.indexOf('hi')>-1)return '👋 Chào bạn!';
if(t.indexOf('cảm ơn')>-1)return '😊 Không có gì!';
if(t.indexOf('mua')>-1||t.indexOf('key')>-1)return '💰 Zalo: <b>0947490509</b>';
if(t.indexOf('cài')>-1||t.indexOf('cách')>-1)return '📖 AdWay → Phần đã bị chặn → Dấu cộng (+) → Thêm từng host → Thêm → Thay đổi';
